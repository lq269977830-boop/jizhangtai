<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F5FA;--surface:#FFFFFF;--surface2:#FBFBFE;
  --t1:#1A1B2E;--t2:#6B6F87;--t3:#A0A4B8;--t4:#D1D4E0;
  --sep:#ECEDF3;
  --accent:#4D7CFF;--accent2:#E8EEFF;--accent3:#F4F7FF;
  --green:#2ECA6A;--red:#FF5A5A;--orange:#FF7A45;--yellow:#E8A810;--purple:#8B5CF6;--cyan:#06B6D4;--pink:#FF6FA8;
  --shadow:6px 6px 16px rgba(140,150,200,0.18),10px 10px 28px rgba(120,130,180,0.12),-6px -6px 16px #ffffff;
  --shadow-soft:3px 3px 8px rgba(140,150,200,0.16),6px 6px 14px rgba(120,130,180,0.10),-3px -3px 8px #ffffff;
  --shadow-in:inset 3px 3px 6px rgba(140,150,200,0.15),inset -3px -3px 6px #ffffff;
  --radius:24px;--radius-sm:18px;--radius-xs:14px;
  --num:"SF Mono","SFMono-Regular",Menlo,"Roboto Mono","Cascadia Mono",Consolas,monospace;
}
body[data-color="blue"]{--accent:#4D7CFF;--accent2:#E8EEFF;--accent3:#F4F7FF}
body[data-color="pink"]{--accent:#FF6FA8;--accent2:#FFE3EE;--accent3:#FFF5F9}
body[data-color="yellow"]{--accent:#E8A810;--accent2:#FFF4D4;--accent3:#FFFBEC}
body[data-color="orange"]{--accent:#FF7A45;--accent2:#FFE0D2;--accent3:#FFF3EE}
body[data-color="green"]{--accent:#2ECA6A;--accent2:#D1F4DF;--accent3:#EDFBF3}
body[data-color="purple"]{--accent:#8B5CF6;--accent2:#E5D9FB;--accent3:#F3EEFD}
body[data-color="cyan"]{--accent:#06B6D4;--accent2:#CFF1F7;--accent3:#EBF9FC}
body[data-theme="dark"]{
  --bg:#1A1B2E;--surface:#252745;--surface2:#2D2F50;
  --t1:#F0F1F8;--t2:#A0A4B8;--t3:#6B6F87;--t4:#3F4163;
  --sep:#3F4163;
  --shadow:6px 6px 16px rgba(0,0,0,0.4),-2px -2px 6px rgba(255,255,255,0.04);
  --shadow-soft:3px 3px 8px rgba(0,0,0,0.3),-2px -2px 4px rgba(255,255,255,0.04);
  --shadow-in:inset 3px 3px 6px rgba(0,0,0,0.35),inset -2px -2px 4px rgba(255,255,255,0.04);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;min-height:100vh;padding-bottom:96px}
.app{max-width:480px;margin:0 auto;padding:14px 14px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.hd h1{font-size:20px;font-weight:800;letter-spacing:-0.5px}
.hd .month{display:flex;align-items:center;gap:5px;background:var(--surface);box-shadow:var(--shadow-soft);border-radius:14px;padding:6px 9px;font-size:13px}
.hd .month button{background:none;border:none;color:var(--t2);font-size:16px;padding:0 3px;cursor:pointer;font-weight:700}
.hd .month b{color:var(--t1);font-weight:700;font-family:var(--num);min-width:74px;text-align:center}
.hd .gear{width:38px;height:38px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-soft);border:none;color:var(--t2);font-size:18px;cursor:pointer}
.hd .gear:active{box-shadow:var(--shadow-in)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:var(--radius);padding:18px 18px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent2);opacity:0.7}
.stat::before{content:"";position:absolute;bottom:-30px;right:-15px;width:60px;height:60px;border-radius:50%;background:var(--accent2);opacity:0.4}
.stat .lbl{font-size:12px;color:var(--t2);position:relative;z-index:1;font-weight:600}
.stat .num{font-family:var(--num);font-size:22px;font-weight:800;margin-top:6px;position:relative;z-index:1;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.stat.inc .num{color:var(--green)}
.stat.exp .num{color:var(--t1)}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-soft);margin-bottom:14px}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.card h3 .set{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
.card h3 .more{font-size:12px;color:var(--t3);font-weight:500}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ring{position:relative;width:100%;max-width:130px;margin:0 auto;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--sep)}
.ring .prog{stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-family:var(--num);font-size:20px;font-weight:800;letter-spacing:-0.5px}
.ring .pct.over{color:var(--red)}
.ring .lab{font-size:11px;color:var(--t2);margin-top:2px;font-weight:600}
.ring-meta{text-align:center;margin-top:8px;font-size:11.5px;color:var(--t2)}
.ring-meta b{font-family:var(--num);color:var(--t1);font-size:13px}
.ring-meta.over b{color:var(--red)}
.pie{display:flex;align-items:center;gap:18px}
.pie svg{width:108px;height:108px;flex-shrink:0}
.pie circle{fill:none;stroke-width:18}
.pie .track{stroke:var(--sep)}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:7px;max-height:130px;overflow-y:auto}
.pie-legend .li{display:flex;align-items:center;gap:8px;font-size:12px}
.pie-legend .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pie-legend .name{flex:1;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-legend .amt{font-family:var(--num);color:var(--t2);font-variant-numeric:tabular-nums}
.pie-legend .pct{font-size:11px;color:var(--t3);font-family:var(--num);min-width:34px;text-align:right}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .wd{font-size:11px;color:var(--t3);text-align:center;padding:4px 0;font-weight:600}
.cal-grid .day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:11.5px;color:var(--t2);background:var(--surface2);box-shadow:var(--shadow-in)}
.cal-grid .day.out{opacity:0.25}
.cal-grid .day.today{background:var(--accent);color:#fff;font-weight:700;box-shadow:var(--shadow-soft)}
.cal-grid .day.has{font-weight:700;color:var(--t1)}
.cal-grid .day .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal-grid .day.has-inc .dot{background:var(--green)}
.cal-grid .day.has-both .dot{background:linear-gradient(90deg,var(--accent) 50%,var(--green) 50%)}
.ai-card{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#000));border-radius:var(--radius);padding:18px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
body[data-theme="dark"] .ai-card{box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.ai-card::before{content:"";position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.13)}
.ai-card::after{content:"";position:absolute;bottom:-50px;left:30%;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.07)}
.ai-card .lbl{font-size:12px;opacity:0.92;display:flex;align-items:center;gap:6px;margin-bottom:10px;font-weight:600;position:relative;z-index:1}
.ai-card .txt{font-size:13px;line-height:1.65;position:relative;z-index:1}
.ai-card .txt b{font-weight:700;font-family:var(--num)}
.recent-list{display:flex;flex-direction:column;gap:8px}
.recent-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--surface2);border-radius:14px}
.recent-item .ic{width:36px;height:36px;border-radius:12px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.recent-item .info{flex:1;min-width:0}
.recent-item .nm{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item .dt{font-size:11px;color:var(--t3);margin-top:2px}
.recent-item .am{font-family:var(--num);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.recent-item .am.inc{color:var(--green)}
.ai-analyze{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-soft);margin-bottom:14px}
.ai-analyze h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.ai-analyze .item{font-size:13px;line-height:1.7;color:var(--t1);margin-bottom:10px;padding:10px 12px;background:var(--surface2);border-radius:12px}
.ai-analyze .item:last-child{margin-bottom:0}
.ai-analyze .item .lbl{color:var(--accent);font-weight:700;font-size:11px;display:block;margin-bottom:3px;letter-spacing:0.5px}
.ai-analyze .item b{font-family:var(--num);color:var(--accent)}
.ai-fab{position:fixed;bottom:96px;right:18px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;box-shadow:var(--shadow);cursor:pointer;z-index:50;transition:transform .2s}
.ai-fab:active{transform:scale(0.92)}
.ai-fab .pulse{position:absolute;top:6px;right:6px;width:10px;height:10px;background:var(--red);border-radius:50%;box-shadow:0 0 0 0 rgba(255,90,90,0.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,90,0.7);}70%{box-shadow:0 0 0 8px rgba(255,90,90,0);}100%{box-shadow:0 0 0 0 rgba(255,90,90,0);}}
.ai-panel{position:fixed;bottom:160px;right:18px;width:300px;max-width:calc(100vw - 36px);max-height:60vh;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px;z-index:49;display:none;overflow-y:auto;border:1px solid var(--sep)}
.ai-panel.show{display:block}
.ai-panel h4{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.ai-panel .msg{font-size:13px;line-height:1.7;margin-bottom:10px;padding:10px 12px;background:var(--bg);border-radius:12px;color:var(--t1)}
.ai-panel .msg b{color:var(--accent)}
.ai-panel .refresh{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:10px;font-size:13px;font-weight:600;margin-top:6px;cursor:pointer}
.ai-panel .refresh:active{opacity:0.85}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:32px;box-shadow:var(--shadow);cursor:pointer;z-index:50;line-height:60px}
.fab:active{transform:translateX(-50%) scale(0.94)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:60;display:none;backdrop-filter:blur(2px)}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px 24px;box-shadow:var(--shadow);z-index:61;transform:translateY(100%);transition:transform .3s;max-height:90vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.grip{width:36px;height:4px;background:var(--t4);border-radius:2px;margin:0 auto 14px}
.sh-t{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;box-shadow:var(--shadow-in);margin-bottom:12px}
.seg .s{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:13px;color:var(--t2);cursor:pointer;font-weight:600}
.seg .s.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-soft)}
.voc-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.voc-btn{background:var(--bg);border:none;box-shadow:var(--shadow-in);border-radius:14px;padding:11px;font-size:12px;color:var(--t2);cursor:pointer;font-weight:600}
.voc-btn:active{box-shadow:var(--shadow-soft);color:var(--accent)}
.voc-btn.live{color:var(--red)}
.voice-tip{font-size:12px;color:var(--accent);background:var(--surface2);border-radius:12px;padding:8px 12px;margin-bottom:10px;display:none;line-height:1.5}
.voice-tip.show{display:block}
.paste-box{margin-bottom:10px;background:var(--surface2);box-shadow:var(--shadow-in);border-radius:12px;padding:10px 12px;display:none}
.paste-box.show{display:block}
.paste-box textarea{width:100%;box-sizing:border-box;background:var(--surface2);border:none;border-radius:10px;padding:10px;font-size:13.5px;color:var(--t1);resize:none;font-family:inherit;outline:none;min-height:42px;box-shadow:var(--shadow-in)}
.paste-row{display:flex;gap:8px;margin-top:8px}
.paste-row .pb{flex:1;background:var(--bg);border:none;box-shadow:var(--shadow-soft);border-radius:12px;padding:8px;font-size:13px;color:var(--accent);font-weight:600}
.paste-row .pb:active{box-shadow:var(--shadow-in)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat-grid .c{aspect-ratio:1;background:var(--surface);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--t2);cursor:pointer;box-shadow:var(--shadow-soft);border:2px solid transparent}
.cat-grid .c.on{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow-in)}
.cat-grid .c .em{font-size:22px;margin-bottom:4px}
.cat-grid .c.add{background:var(--bg);box-shadow:var(--shadow-in);color:var(--accent)}
.amt-box{display:flex;align-items:center;background:var(--bg);box-shadow:var(--shadow-in);border-radius:18px;padding:12px 16px;margin-bottom:10px}
.amt-box .cur{font-size:18px;color:var(--t2);font-family:var(--num);margin-right:8px;font-weight:700}
.amt-box input{flex:1;background:none;border:none;outline:none;font-size:26px;font-weight:800;font-family:var(--num);color:var(--t1);font-variant-numeric:tabular-nums}
.note-input{width:100%;background:var(--surface2);box-shadow:var(--shadow-in);border:none;border-radius:12px;padding:10px 14px;font-size:13px;color:var(--t1);margin-bottom:10px;font-family:inherit;outline:none}
.btn-row{display:flex;gap:10px}
.btn{flex:1;background:var(--accent);color:#fff;border:none;border-radius:16px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-soft);display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{box-shadow:var(--shadow-in);opacity:0.95}
.btn-s{background:var(--bg);color:var(--t2);box-shadow:var(--shadow-in)}
.save-ic{width:26px;height:26px;border-radius:7px;vertical-align:middle;margin-right:6px;object-fit:cover}
.set-sec{margin-bottom:18px}
.set-sec .lab{font-size:12px;color:var(--t2);font-weight:600;margin-bottom:8px;padding-left:4px}
.set-btn{width:100%;background:var(--surface);border:none;box-shadow:var(--shadow-soft);border-radius:14px;padding:13px 16px;font-size:13.5px;color:var(--t1);text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.set-btn:active{box-shadow:var(--shadow-in)}
.set-btn span{color:var(--t3)}
.set-btn.danger{color:var(--red)}
.theme-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
.theme-grid .t{aspect-ratio:1;border-radius:50%;cursor:pointer;box-shadow:var(--shadow-soft);border:3px solid transparent;transition:transform .15s}
.theme-grid .t:active{transform:scale(0.92)}
.theme-grid .t.on{border-color:var(--t1);box-shadow:var(--shadow-soft),0 0 0 3px var(--surface) inset}
.color-pick{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:14px;margin-bottom:8px}
.color-pick input[type=color]{width:36px;height:36px;border:none;border-radius:10px;cursor:pointer;background:none;padding:0}
.color-pick .nm{font-size:12px;color:var(--t2);font-weight:600}
.budget-input{width:100%;background:var(--bg);box-shadow:var(--shadow-in);border:none;border-radius:12px;padding:11px 14px;font-size:13px;color:var(--t1);margin-bottom:8px;font-family:var(--num);outline:none}
.list{margin-top:8px}
.list-day{font-size:12px;color:var(--t2);font-weight:600;padding:10px 4px 6px;display:flex;justify-content:space-between}
.list-day b{font-family:var(--num);color:var(--t1);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border-radius:14px;margin-bottom:6px;box-shadow:var(--shadow-soft)}
.row .ic{width:36px;height:36px;border-radius:12px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dt{font-size:11px;color:var(--t3);margin-top:2px}
.row .am{font-family:var(--num);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.row .am.inc{color:var(--green)}
.row .del{background:none;border:none;color:var(--t3);font-size:18px;padding:4px 8px;cursor:pointer}
.row .del:active{color:var(--red)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

function drawRing(id,pct,num,colorKey){
  const box=document.getElementById(id);
  const c=box.querySelector(".prog");
  const r=40,C=2*Math.PI*r;
  c.setAttribute("stroke-dasharray",C.toFixed(2));
  c.setAttribute("stroke-dashoffset",(C*(1-pct)).toFixed(2));
  const colors={green:"var(--green)",red:"var(--red)",accent:"var(--accent)"};
  c.setAttribute("stroke",colors[colorKey]||colors.accent);
  const pEl=box.querySelector(".pct");
  pEl.textContent=num+"%";
  pEl.classList.toggle("over",colorKey==="red");
}

function renderPie(expRecs){
  const pieBox=document.getElementById("pieBox");
  const svg=pieBox.querySelector("svg");
  const lg=document.getElementById("pieLg");
  const empty=document.getElementById("pieEmpty");
  while(svg.children.length>1)svg.removeChild(svg.lastChild);
  lg.innerHTML="";
  if(expRecs.length===0){empty.style.display="block";pieBox.style.opacity="0.4";return;}
  empty.style.display="none";pieBox.style.opacity="1";
  const groups={};
  expRecs.forEach(r=>{groups[r.cat]=(groups[r.cat]||0)+r.amount;});
  const total=Object.values(groups).reduce((s,v)=>s+v,0);
  const sorted=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  const C=2*Math.PI*15.9;
  let offset=0;
  sorted.forEach(([k,amt])=>{
    const cat=catOf("exp",k);
    const pct=amt/total;
    const seg=document.createElementNS("http://www.w3.org/2000/svg","circle");
    seg.setAttribute("class","seg");
    seg.setAttribute("cx","18");seg.setAttribute("cy","18");seg.setAttribute("r","15.9");
    seg.setAttribute("stroke",cat.c);
    seg.setAttribute("stroke-dasharray",`${(C*pct).toFixed(2)} ${(C*(1-pct)).toFixed(2)}`);
    seg.setAttribute("stroke-dashoffset",(-C*offset).toFixed(2));
    svg.appendChild(seg);
    offset+=pct;
    const li=document.createElement("div");
    li.className="li";
    li.innerHTML=`<span class="dot" style="background:${cat.c}"></span><span class="name">${cat.e} ${cat.n}</span><span class="amt">¥${fmt(amt)}</span><span class="pct">${(pct*100).toFixed(0)}%</span>`;
    lg.appendChild(li);
  });
}

  });

  const td=new Date().getDate(),ty=new Date().getFullYear(),tm=new Date().getMonth()+1;
  for(let i=1;i<=dMax;i++){

function aiMonthlySummary(recs,inc,exp){
  const bExp=state.settings.budget.exp||0;
  const today_d=new Date();
  const dayPassed=today_d.getDate();
  const daysTotal=daysInMonth(cur.year,cur.month);
  const expPct=bExp>0?Math.round(exp/bExp*100):0;
  // 比上月同期
  const prevMk=cur.month===1?(cur.year-1)+"-12":cur.year+"-"+String(cur.month-1).padStart(2,"0");
  const prevRecs=state.records.filter(r=>mKey(r.date)===prevMk);
  const prevExp=prevRecs.filter(r=>r.type==="exp").reduce((s,r)=>s+r.amount,0);
  const diffPrev=exp-prevExp;
  // 主要类
  const groups={};
  recs.filter(r=>r.type==="exp").forEach(r=>{groups[r.cat]=(groups[r.cat]||0)+r.amount;});
  const top=Object.entries(groups).sort((a,b)=>b[1]-a[1]).slice(0,2);
  const topStr=top.map(([k,v])=>catOf("exp",k).n).join("和");
  const top2=arrSum(groups)>0?(top[0]?top[0][1]/sumExp(recs):0):0;
  let msg="";
  if(recs.length===0){msg="本月还没有记账数据，<b>开始第一笔吧</b> ~";}
  else if(bExp>0&&expPct>=100){msg=`本月已花 <b>¥${fmt(exp)}</b>，<b>超出预算 ¥${fmt(exp-bExp)}</b>（${expPct}%）！建议紧急冻结非必要支出。`;}
  else if(bExp>0&&expPct>=80){msg=`本月已花 <b>¥${fmt(exp)}</b>，占预算 <b>${expPct}%</b>${topStr?`，主要在<strong>${topStr}</strong>`:''}。${dayPassed<daysTotal?`剩余 ${daysTotal-dayPassed} 天，平均每天可花 <b>¥${fmt(Math.max((bExp-exp)/(daysTotal-dayPassed),0))}</b>`:''}。`;}
  else if(recs.length>0){msg=`本月已花 <b>¥${fmt(exp)}</b>${bExp?`（预算 ${expPct}%）`:''}${diffPrev>0?`，比上月同期<b>多 ¥${fmt(diffPrev)}</b>`:diffPrev<0?`，比上月同期<b>少 ¥${fmt(-diffPrev)}</b>`:''}${topStr?`，主要在<strong>${topStr}</strong>`:''}。`;}
  else{msg="本月暂无支出。";}
  return msg;
}
function sumExp(recs){return recs.filter(r=>r.type==="exp").reduce((s,r)=>s+r.amount,0);}
function arrSum(o){return Object.values(o).reduce((s,v)=>s+v,0);}

function renderAIAnalyze(recs,inc,exp){
  const box=document.getElementById("aiAnalyze");
  const bExp=state.settings.budget.exp||0;
  const today_d=new Date();
  const dayPassed=today_d.getDate();
  const daysTotal=daysInMonth(cur.year,cur.month);
  const daysLeft=Math.max(daysTotal-dayPassed,0);
  // 历史3个月平均
  const months=[];
  for(let i=1;i<=3;i++){
    let pm=cur.month-i,py=cur.year;
    if(pm<=0){pm+=12;py-=1;}
    const mk=py+"-"+String(pm).padStart(2,"0");
    const e=state.records.filter(r=>mKey(r.date)===mk&&r.type==="exp").reduce((s,r)=>s+r.amount,0);
    months.push(e);
  }
  const avg3=months.length>0?months.reduce((s,v)=>s+v,0)/months.length:0;
  const diffAvg=exp-avg3;
  const pctAvg=avg3>0?Math.round(diffAvg/avg3*100):0;
  // 预测
  const dailyAvg=dayPassed>0?exp/dayPassed:0;
  const forecast=Math.round(dailyAvg*(daysTotal));
  // 储蓄建议
  let savTip="";
  if(bExp>0){
    const remain=Math.max(bExp-exp,0);
    const perDay=daysLeft>0?Math.round(remain/daysLeft):0;
    if(remain>0)savTip=`剩余 ${daysLeft} 天，预算还剩 <b>¥${fmt(remain)}</b>，平均每天可花 <b>¥${fmt(perDay)}</b>`;
    else savTip="本月预算已用完，建议下月优化";
  }else{
    savTip="设置预算后可获得更精准建议";
  }
  // 高类
  const groups={};
  recs.filter(r=>r.type==="exp").forEach(r=>{groups[r.cat]=(groups[r.cat]||0)+r.amount;});
  const top=Object.entries(groups).sort((a,b)=>b[1]-a[1])[0];
  const topInfo=top?`主要增加在<strong>${catOf("exp",top[0]).n}</strong>（+¥${fmt(top[1])}）`:"";

  let html="";
  if(recs.length===0){html='<div class="item"><span class="lbl">📈 提示</span>暂无数据，开始记账后这里会自动生成分析。</div>';}
  else{
    html+=`<div class="item"><span class="lbl">📈 历史对比</span>本月支出 ¥${fmt(exp)}，与过去3个月平均（¥${fmt(avg3)}）相比${pctAvg>0?`<b>高 ${pctAvg}%</b>`:pctAvg<0?`<b style="color:var(--green)">低 ${-pctAvg}%</b>`:"<b>持平</b>"}。${topInfo}</div>`;
    html+=`<div class="item"><span class="lbl">🔮 支出预测</span>按当前日均 <b>¥${fmt(dailyAvg)}</b>，预计月底支出约 <b>¥${fmt(forecast)}</b>${bExp>0?(forecast>bExp?`，<span style="color:var(--red)">将超支 ¥${fmt(forecast-bExp)}</span>`:"，将控制在预算内")+"。":""}</div>`;
    html+=`<div class="item"><span class="lbl">💰 储蓄建议</span>${savTip}${bExp>0&&forecast>bExp?`。若想本月多存 <b>¥1,000</b>，建议剩余时间每天控制在 <b>¥${fmt(Math.max((bExp-exp-1000)/daysLeft,0))}</b> 以内。`:""}</div>`;
  }
  box.innerHTML=html;
}

function aiAssistant(){
  const recs=state.records.filter(r=>mKey(r.date)===cur.year+"-"+String(cur.month).padStart(2,"0"));
  const exp=sumExp(recs);
  const bExp=state.settings.budget.exp||0;
  const msgs=[];
  if(recs.length===0){msgs.push("💡 还没开始记账，先记一笔吧～");}
  else{
    const groups={};
    recs.filter(r=>r.type==="exp").forEach(r=>{groups[r.cat]=(groups[r.cat]||0)+r.amount;});
    const top=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
    if(top[0]){const pct=Math.round(top[0][1]/exp*100);msgs.push(`📊 <b>${catOf("exp",top[0][0]).n}</b>是本月最大支出，占 <b>${pct}%</b>（¥${fmt(top[0][1])}）。看看有没有可砍的。`);}
    if(bExp>0&&exp>bExp){msgs.push(`⚠️ 已超支 <b>¥${fmt(exp-bExp)}</b>。建议冻结非必要支出（外卖/购物/娱乐），优先保🟢必要类。`);}
    else if(bExp>0){msgs.push(`✅ 预算还剩 <b>¥${fmt(bExp-exp)}</b>，保持当前节奏！`);}
    // 攒钱建议
    msgs.push("💰 <b>储蓄小技巧</b>：① 餐饮用月度预算；② 大额支出等 24 小时再决定；③ 每月至少存 10% 收入。");
    // 趋势
    const prevMk=cur.month===1?(cur.year-1)+"-12":cur.year+"-"+String(cur.month-1).padStart(2,"0");
    const prevExp=state.records.filter(r=>mKey(r.date)===prevMk&&r.type==="exp").reduce((s,r)=>s+r.amount,0);
    if(exp>prevExp&&prevExp>0){msgs.push(`📈 比上月多 ¥${fmt(exp-prevExp)}。建议复盘本月账单找原因。`);}
    else if(exp<prevExp&&prevExp>0){msgs.push(`📉 比上月少 ¥${fmt(prevExp-exp)}，继续保持！`);}
  }
  return msgs;
}

function parseAmountFromText(text){
  const m=text.match(/(\d+(?:\.\d+)?)/);
  if(!m)return null;
  const v=parseFloat(m[1]);if(isNaN(v))return null;return v;
}
function matchCat(text){
  for(const [k,kws] of VOICE_CAT){if(kws.some(w=>text.indexOf(w)>=0))return k;}
  return null;
}
function applyVoiceText(text){
  const amt=parseAmountFromText(text);
  if(amt)document.getElementById("amtInput").value=amt.toFixed(2);
  const ck=matchCat(text);
  if(ck){cur.cat=ck;buildCatGrid();}
  document.getElementById("noteInput").value=text;
  tempVoice=text;
  const tip=document.getElementById("voiceTip");

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("浏览器不支持语音");return;}
  if(!window.isSecureContext){
    const tip=document.getElementById("voiceTip");tip.classList.add("show");
    tip.textContent="语音需 https/localhost。可用手机输入法麦克风说出内容→复制→点「⌨️ 粘贴」识别。";
    return;
  }
  if(recog&&recog._live){stopVoice();return;}
  let finalT="",interimT="";
  const tip=document.getElementById("voiceTip");const vb=document.getElementById("voiceBtn");
  try{recog=new SR();recog.lang="zh-CN";recog.interimResults=true;recog.continuous=false;recog._live=true;}catch(e){toast("无法创建语音识别");return;}
  tip.classList.add("show");vb.classList.add("live");
  document.getElementById("voiceBtn").textContent="⏹ 停止";
  tip.textContent="请说消费内容，如「午餐花了25」…";
  recog.onresult=e=>{interimT="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalT+=t;else interimT+=t;}tip.textContent=(finalT||"")+(interimT?" "+interimT:"");};
  recog.onerror=e=>{let msg="识别出错";if(e.error==="not-allowed")msg="麦克风权限被拒";else if(e.error==="network")msg="网络异常，语音需联网";else if(e.error==="no-speech")msg="没听到声音";else if(e.error==="audio-capture")msg="未检测到麦克风";tip.textContent=msg;stopVoice();};
  recog.onend=()=>{const txt=(finalT+interimT).trim();if(txt){applyVoiceText(txt);}stopVoice();};
  try{recog.start();}catch(e){stopVoice();}
}
function stopVoice(){if(recog){try{recog.stop();}catch(e){}recog._live=false;recog=null;}const vb=document.getElementById("voiceBtn");vb.classList.remove("live");vb.innerHTML="🎤 语音";}

function closePaste(){document.getElementById("pasteBox").classList.remove("show");}
function doPaste(){const txt=document.getElementById("pasteInput").value.trim();if(!txt){toast("请输入内容");return;}applyVoiceText(txt);closePaste();toast("已识别");}

function pickImage(){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{tempImg=r.result;toast("图片已选，可填备注后保存");};r.readAsDataURL(f);};inp.click();}

function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="记账台备份_"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("已导出");}
function importData(){const f=document.getElementById("importFile");if(!f)return;f.value="";f.click();}
function onImportFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||!Array.isArray(data.records)){toast("格式不对");return;}const merge=state.records.length>0?confirm("合并到当前数据？\n确定=合并，取消=覆盖"):true;if(merge){const map={};state.records.forEach(x=>map[x.id]=x);data.records.forEach(x=>map[x.id]=x);state.records=Object.values(map);if(Array.isArray(data.categories)){const cm={};state.categories.exp.forEach(c=>cm[c.k]=c);data.categories.exp.forEach(c=>cm[c.k]=c);state.categories.inc.forEach(c=>cm[c.k]=c);data.categories.inc.forEach(c=>cm[c.k]=c);state.categories={exp:Object.values(cm.exp),inc:Object.values(cm.inc)};}}else{state.records=data.records;if(data.categories)state.categories=data.categories;}save();render();toast("已导入 "+data.records.length+" 条");closeSet();}catch(err){toast("解析失败");}};r.readAsText(file);}
function clearData(){if(!confirm("确定清空全部数据？不可恢复！"))return;state.records=[];save();render();toast("已清空");}

function toggleAI(){
  const p=document.getElementById("aiPanel");
  if(p.classList.contains("show")){p.classList.remove("show");return;}
  const msgs=aiAssistant();
  document.getElementById("aiMsgs").innerHTML=msgs.map(m=>'<div class="msg">'+m+'</div>').join("");
  p.classList.add("show");
}

// 初始化
load();applyTheme();render();
// 类型切换
document.getElementById("typeSeg").querySelectorAll(".s").forEach(s=>s.addEventListener("click",()=>{document.querySelectorAll("#typeSeg .s").forEach(x=>x.classList.remove("on"));s.classList.add("on");cur.type=s.dataset.type;cur.cat=null;buildCatGrid();}));
document.getElementById("fab").addEventListener("click",openSheet);
document.getElementById("mask").addEventListener("click",closeSheet);
document.getElementById("cancelBtn").addEventListener("click",closeSheet);
document.getElementById("saveBtn").addEventListener("click",saveRec);
document.getElementById("voiceBtn").addEventListener("click",startVoice);
document.getElementById("imgBtn").addEventListener("click",pickImage);
document.getElementById("pasteBtn").addEventListener("click",openPaste);
document.getElementById("pasteOk").addEventListener("click",doPaste);
document.getElementById("pasteCancel").addEventListener("click",closePaste);
document.getElementById("setBtn").addEventListener("click",openSet);
document.getElementById("maskSet").addEventListener("click",closeSet);
document.getElementById("closeSet").addEventListener("click",closeSet);
document.getElementById("budgetInput").addEventListener("change",e=>{state.settings.budget.exp=parseFloat(e.target.value)||0;save();render();});
document.getElementById("incomeInput").addEventListener("change",e=>{state.settings.budget.inc=parseFloat(e.target.value)||0;save();render();});
document.getElementById("aiKeyInput").addEventListener("change",e=>{state.settings.aiKey=e.target.value;save();});document.getElementById("aiBaseInput").addEventListener("change",e=>{state.settings.aiBase=e.target.value;save();});
document.getElementById("exportBtn").addEventListener("click",exportData);
document.getElementById("importBtn").addEventListener("click",importData);
document.getElementById("importFile").addEventListener("change",onImportFile);
document.getElementById("clearBtn").addEventListener("click",clearData);
document.getElementById("prevM").addEventListener("click",()=>navigateMonth(-1));
document.getElementById("nextM").addEventListener("click",()=>navigateMonth(1));
document.getElementById("setBudget").addEventListener("click",openSet);
document.getElementById("colorPick").addEventListener("change",e=>{state.settings.themeColor=e.target.value;state.settings.theme="custom";applyTheme();save();renderThemeGrid();});
document.getElementById("themeSeg").querySelectorAll(".s").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll("#themeSeg .s").forEach(x=>x.classList.remove("on"));t.classList.add("on");state.settings.dark=t.dataset.th==="dark";applyTheme();save();}));
document.getElementById("aiFab").addEventListener("click",toggleAI);
document.getElementById("aiRefresh").addEventListener("click",()=>{const msgs=aiAssistant();document.getElementById("aiMsgs").innerHTML=msgs.map(m=>'<div class="msg">'+m+'</div>').join("");});
// 初始化外观按钮
document.querySelectorAll("#themeSeg .s").forEach(t=>{if((t.dataset.th==="dark")===state.settings.dark)t.classList.add("on");else t.classList.remove("on");});
</script>
</body>
</html>
